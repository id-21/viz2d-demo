<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viz2D File Comparison</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background: #1a1a2e;
      color: #eee;
    }
    h1 { color: #00d4ff; }
    h2 { color: #7b68ee; margin-top: 30px; }
    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin: 20px 0;
    }
    .file-panel {
      background: #16213e;
      border-radius: 8px;
      padding: 20px;
    }
    .file-panel h3 {
      margin-top: 0;
      color: #00d4ff;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
    }
    th, td {
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid #333;
    }
    th { color: #7b68ee; }
    .summary {
      background: #0f3460;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
    }
    .summary h3 { color: #00d4ff; margin-top: 0; }
    .diff-added { color: #4ade80; }
    .diff-removed { color: #f87171; }
    .diff-changed { color: #fbbf24; }
    .loading { color: #888; font-style: italic; }
    pre {
      background: #0a0a1a;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
      font-size: 12px;
    }
    .status {
      padding: 10px 15px;
      border-radius: 5px;
      margin: 10px 0;
    }
    .status.loading { background: #1e3a5f; }
    .status.success { background: #064e3b; color: #4ade80; }
    .status.error { background: #7f1d1d; color: #f87171; }
  </style>
</head>
<body>
  <h1>Viz2D File Comparison Tool</h1>
  <p>Comparing: <code>2.viz2d</code> vs <code>2_new_demo.viz2d</code></p>

  <div id="status" class="status loading">Loading viz2d files...</div>

  <div id="results"></div>

  <script type="module">
    import { TextureRenderer } from '/@viz2d/core';

    const FILE_OLD = './2.viz2d';
    const FILE_NEW = './2_new_demo.viz2d';

    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');

    function setStatus(message, type = 'loading') {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`;
    }

    async function loadViz2dFile(url) {
      const response = await fetch(url);
      const arrayBuffer = await response.arrayBuffer();
      const bytes = new Uint8Array(arrayBuffer);

      const renderer = new TextureRenderer();
      renderer.load(bytes);

      const segments = renderer.get_segments();
      const imageSize = renderer.get_image_size();

      return { renderer, segments, imageSize, fileSize: bytes.length };
    }

    function analyzeSegments(segments) {
      const classCounts = {};
      const classSegments = {};
      let totalMaskPixels = 0;

      segments.forEach(seg => {
        const className = seg.class_name || 'unknown';
        classCounts[className] = (classCounts[className] || 0) + 1;

        if (!classSegments[className]) {
          classSegments[className] = [];
        }
        classSegments[className].push({
          id: seg.segment_id,
          maskSize: seg.mask?.length || 0
        });

        totalMaskPixels += seg.mask?.length || 0;
      });

      return { classCounts, classSegments, totalMaskPixels };
    }

    function generateReport(oldData, newData) {
      const oldAnalysis = analyzeSegments(oldData.segments);
      const newAnalysis = analyzeSegments(newData.segments);

      // Get all unique class names
      const allClasses = new Set([
        ...Object.keys(oldAnalysis.classCounts),
        ...Object.keys(newAnalysis.classCounts)
      ]);

      let html = `
        <h2>Summary</h2>
        <div class="summary">
          <h3>Key Differences</h3>
          <table>
            <tr>
              <th>Metric</th>
              <th>2.viz2d (Old)</th>
              <th>2_new_demo.viz2d (New)</th>
              <th>Change</th>
            </tr>
            <tr>
              <td>File Size</td>
              <td>${(oldData.fileSize / 1024 / 1024).toFixed(2)} MB</td>
              <td>${(newData.fileSize / 1024 / 1024).toFixed(2)} MB</td>
              <td class="${newData.fileSize > oldData.fileSize ? 'diff-added' : 'diff-removed'}">
                ${((newData.fileSize - oldData.fileSize) / 1024).toFixed(1)} KB
              </td>
            </tr>
            <tr>
              <td>Image Size</td>
              <td>${oldData.imageSize.width} x ${oldData.imageSize.height}</td>
              <td>${newData.imageSize.width} x ${newData.imageSize.height}</td>
              <td>${oldData.imageSize.width === newData.imageSize.width ? 'Same' : 'Changed'}</td>
            </tr>
            <tr>
              <td><strong>Total Segments</strong></td>
              <td><strong>${oldData.segments.length}</strong></td>
              <td><strong>${newData.segments.length}</strong></td>
              <td class="${newData.segments.length > oldData.segments.length ? 'diff-added' : 'diff-removed'}">
                <strong>${newData.segments.length > oldData.segments.length ? '+' : ''}${newData.segments.length - oldData.segments.length}</strong>
              </td>
            </tr>
            <tr>
              <td>Unique Classes</td>
              <td>${Object.keys(oldAnalysis.classCounts).length}</td>
              <td>${Object.keys(newAnalysis.classCounts).length}</td>
              <td>${Object.keys(newAnalysis.classCounts).length - Object.keys(oldAnalysis.classCounts).length}</td>
            </tr>
            <tr>
              <td>Total Mask Pixels</td>
              <td>${oldAnalysis.totalMaskPixels.toLocaleString()}</td>
              <td>${newAnalysis.totalMaskPixels.toLocaleString()}</td>
              <td>${(newAnalysis.totalMaskPixels - oldAnalysis.totalMaskPixels).toLocaleString()}</td>
            </tr>
          </table>
        </div>

        <h2>Segments by Class</h2>
        <div class="summary">
          <p>This shows how many <strong>instances</strong> of each semantic class exist in each file.</p>
          <table>
            <tr>
              <th>Class Name</th>
              <th>Old File (Count)</th>
              <th>New File (Count)</th>
              <th>Difference</th>
            </tr>
            ${Array.from(allClasses).sort().map(className => {
              const oldCount = oldAnalysis.classCounts[className] || 0;
              const newCount = newAnalysis.classCounts[className] || 0;
              const diff = newCount - oldCount;
              let diffClass = '';
              if (diff > 0) diffClass = 'diff-added';
              else if (diff < 0) diffClass = 'diff-removed';

              return `
                <tr>
                  <td>${className}</td>
                  <td>${oldCount}</td>
                  <td>${newCount}</td>
                  <td class="${diffClass}">${diff > 0 ? '+' : ''}${diff}</td>
                </tr>
              `;
            }).join('')}
          </table>
        </div>

        <h2>Detailed Segment Data</h2>
        <div class="comparison-grid">
          <div class="file-panel">
            <h3>2.viz2d (Old) - ${oldData.segments.length} segments</h3>
            <pre>${JSON.stringify(oldData.segments.map(s => ({
              id: s.segment_id,
              class: s.class_name,
              maskPixels: s.mask?.length || 0
            })), null, 2)}</pre>
          </div>
          <div class="file-panel">
            <h3>2_new_demo.viz2d (New) - ${newData.segments.length} segments</h3>
            <pre>${JSON.stringify(newData.segments.map(s => ({
              id: s.segment_id,
              class: s.class_name,
              maskPixels: s.mask?.length || 0
            })), null, 2)}</pre>
          </div>
        </div>

        <h2>Interpretation</h2>
        <div class="summary">
          ${newData.segments.length > oldData.segments.length ? `
            <p class="diff-added"><strong>The new file has MORE segments (${newData.segments.length} vs ${oldData.segments.length}).</strong></p>
            <p>This indicates the new file uses <strong>instance segmentation</strong> where objects of the same class
            (like multiple walls) are split into separate selectable segments, rather than being grouped together.</p>
          ` : newData.segments.length < oldData.segments.length ? `
            <p class="diff-removed"><strong>The new file has FEWER segments.</strong></p>
          ` : `
            <p><strong>Both files have the same number of segments.</strong></p>
          `}

          <h4>Classes with more instances in new file:</h4>
          <ul>
            ${Array.from(allClasses)
              .filter(c => (newAnalysis.classCounts[c] || 0) > (oldAnalysis.classCounts[c] || 0))
              .map(c => `<li class="diff-added">${c}: ${oldAnalysis.classCounts[c] || 0} → ${newAnalysis.classCounts[c] || 0}</li>`)
              .join('') || '<li>None</li>'}
          </ul>
        </div>
      `;

      return html;
    }

    async function main() {
      try {
        setStatus('Loading 2.viz2d (old file)...', 'loading');
        const oldData = await loadViz2dFile(FILE_OLD);

        setStatus('Loading 2_new_demo.viz2d (new file)...', 'loading');
        const newData = await loadViz2dFile(FILE_NEW);

        setStatus('Comparison complete!', 'success');

        resultsEl.innerHTML = generateReport(oldData, newData);

        // Log to console for debugging
        console.log('Old file data:', oldData);
        console.log('New file data:', newData);

      } catch (error) {
        setStatus(`Error: ${error.message}`, 'error');
        console.error(error);
        resultsEl.innerHTML = `<pre style="color: #f87171;">${error.stack}</pre>`;
      }
    }

    main();
  </script>
</body>
</html>
